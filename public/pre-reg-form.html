<!doctype html>
<html lang="uk" class="nonames">
<head>
<meta charset="utf-8">
<base href="/">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Анкета передзапису — Вища Ліга 6.0</title>
<meta name="description" content="Анкета передзапису на шостий потік програми «Вища Ліга».">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#000000">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="preload" href="assets/fonts/oswald-cyrillic-700-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="prereg.css">
</head>
<body>

<div class="bg" aria-hidden="true"><i class="b1"></i><i class="b2"></i><i class="b3"></i></div>

<header class="hero prereg">
  <div class="hero-in">
    <div class="topbar">
      <span class="brand d" data-p18n="brand">Вища Ліга 6.0</span>
      <div class="langs" role="group" aria-label="Language">
        <button type="button" class="lang" data-lang="ua">UA</button>
        <span class="lang-sep">|</span>
        <button type="button" class="lang" data-lang="ru">RU</button>
      </div>
    </div>

    <div class="hero-main">
      <p class="qual" data-p18n="qual">Преміальна програма з масштабування інфобізнесів</p>
      <h1 class="d">
        <span class="h1-l" data-p18n="h1a">Зроби свій запуск у 2027</span>
        <span class="h1-l h1-big gold" data-p18n="h1b">рекордним</span>
        <span class="h1-l" data-p18n="h1c">і підготуйся до нових реалій ринку</span>
      </h1>
    </div>

    <!-- Фото потоку: краї вже згашені в самому файлі, тому ніяких масок зверху -->
    <div class="hero-pic" aria-hidden="true">
      <img src="assets/img/team-fade.webp" alt="" width="780" height="520" decoding="async" fetchpriority="high">
    </div>

    <section class="offer" aria-label="Бонус передзапису">
      <div class="bonus">
        <div class="lap" aria-hidden="true">
          <div class="lap-scr">
            <video class="lap-v" muted loop playsinline preload="none" poster="assets/video/bonus.jpg">
              <source src="assets/video/bonus.mp4" type="video/mp4">
            </video>
          </div>
          <div class="lap-base"></div>
        </div>
        <div class="bonus-t">
          <span class="bonus-h"><span data-p18n="bonusA">Заповни анкету до</span> <b id="deadline">—</b></span>
          <span class="bonus-s" data-p18n="bonusB">та гарантовано отримай бонус</span>
          <span class="bonus-n" data-p18n="bonusN">«Розбір мого запуску на $300К»</span>
        </div>
      </div>

      <a class="btn offer-go" href="#prereg-slot" data-p18n="offerCta">Дізнатися деталі програми</a>

      <!-- Сюди rtg.js монтує анкету. При кліку з ленти та сама картка переїжджає в попап. -->
      <div class="form-slot" id="prereg-slot"></div>
    </section>
  </div>
</header>

<main class="wall-wrap">
  <h2 class="wall-h d">
    <span data-p18n="wallA">Результати учасників</span>
    <span class="gold" data-p18n="wallB">Вища Ліга</span>
  </h2>
  <div class="wall" id="wall"></div>
</main>

<div class="cta-bar" id="cta" aria-hidden="true">
  <div class="cta-bg"></div>
  <div class="cta-in">
    <a class="btn" id="cta-link" href="#prereg-slot" tabindex="-1" data-p18n="cta">Залишити анкету</a>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script src="prereg.js"></script>
</body>
</html>
